			shellPath = /bin/sh;
			shellScript = "# builds cmd/walker and cmd/configvalidator into Contents/Helpers - the app runs\n# local walkers with the first, the config editor uses the second\n# go is the toolchain pinned in the repo's mise.toml\nset -e\nROOT=$(cd \"$SRCROOT/..\" && pwd)\nexport PATH=\"$PATH:/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin\"\nif ! command -v mise >/dev/null; then\n  echo \"error: mise is needed to build the walker helpers - https://mise.jdx.dev, then run 'mise trust && mise install' in $ROOT\"\n  exit 1\nfi\nif ! GO=$(mise -C \"$ROOT\" which go 2>/dev/null); then\n  echo \"error: go from mise.toml is not available - run 'mise trust && mise install' in $ROOT\"\n  exit 1\nfi\nexport GOTOOLCHAIN=local\necho \"building helpers with $(\"$GO\" version)\"\nHELPERS=\"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers\"\nmkdir -p \"$HELPERS\"\nfor TOOL in walker configvalidator; do\n  SLICES=\"\"\n  for ARCH in $ARCHS; do\n    GOARCH=\"$ARCH\"\n    if [ \"$ARCH\" = \"x86_64\" ]; then GOARCH=amd64; fi\n    OUT=\"$DERIVED_FILE_DIR/$TOOL-$ARCH\"\n    CGO_ENABLED=0 GOOS=darwin GOARCH=\"$GOARCH\" \"$GO\" build -C \"$ROOT/go\" -trimpath -o \"$OUT\" \"./cmd/$TOOL\"\n    SLICES=\"$SLICES $OUT\"\n  done\n  lipo -create $SLICES -output \"$HELPERS/$TOOL\"\n  codesign --force --options runtime --timestamp=none --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" \"$HELPERS/$TOOL\"\ndone\n";
			showEnvVarsInLog = 0;
