<!-- a category on the index page: image, name and a teaser text -->
<val:component marker="category-tile">
    <a val:attr-href="required" val:score="1">
        <img val:score="2" val:attr-alt="min-length:5" val:attr-src="required" />
        <h3 val:score="2" val:min-length="3" />
    </a>
    <p val:score="2" val:min-words="10" />
</val:component>
