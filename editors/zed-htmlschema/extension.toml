id = "htmlschema"
name = "htmlschema"
description = "Completion, hover and lint diagnostics for foomo walker htmlschema files"
version = "0.1.0"
schema_version = 1
authors = ["Jan Halfar <jan@bestbytes.com>"]
repository = "https://github.com/foomo/walker"

# runs next to the html language server - it only acts on files in schema
# roots, directories with groups/ or default.html
[language_servers.htmlschema-lsp]
name = "htmlschema"
languages = ["HTML"]
