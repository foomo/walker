[tools]
go = "1.27"
# gotsrpc must match github.com/foomo/gotsrpc/v3 in go/go.mod
"go:github.com/foomo/gotsrpc/v3/cmd/gotsrpc" = "3.2.0"

[tasks.build]
description = "Build everything"
dir = "go"
run = "go build ./..."

[tasks.test]
description = "Run all tests"
dir = "go"
run = "go test ./..."

[tasks.walker]
description = "Run the crawler + web UI, e.g. mise run walker cmd/walker/config-example.yaml (paths relative to go/)"
dir = "go"
run = "go run ./cmd/walker"

[tasks.demo]
description = "Run the demo shop on :8080"
dir = "go"
run = "go run ./cmd/demo"

[tasks.validator]
description = "Validate one page: mise run validator shape-root group https://host/page"
dir = "go"
run = "go run ./cmd/validator"

[tasks.configvalidator]
description = "Validate a walker config: mise run configvalidator config.yaml"
dir = "go"
run = "go run ./cmd/configvalidator"

[tasks."generate:go"]
description = "Generate the Go gotsrpc proxy"
dir = "go"
run = "gotsrpc gotsrpc.yaml"

# goswiftrpc is pre-alpha and has no mise support yet, so it is installed on every run
[tasks."generate:swift"]
description = "Generate the Swift client in macos/Walker/Generated"
dir = "go"
run = """
go install github.com/foomo/goswiftrpc/cmd/goswiftrpc@latest
BIN=$(go env GOBIN)
"${BIN:-$(go env GOPATH)/bin}/goswiftrpc" generate goswiftrpc.yaml
"""

[tasks.generate]
description = "Regenerate the Go proxy and the Swift client"
depends = ["generate:go", "generate:swift"]

[tasks.lsp]
description = "Install the semantic shape language server"
dir = "go"
run = "go install ./cmd/semanticshape-lsp"

# editor extensions for the semantic shape language server - both start
# semanticshape-lsp from the PATH, `mise run lsp` installs it
[tasks."editors:zed"]
description = "Build the Zed extension to wasm - Zed builds it itself on `zed: install dev extension`, this checks it compiles"
dir = "editors/zed-semanticshape"
run = """
rustup target add wasm32-wasip2
cargo build --release --target wasm32-wasip2
"""

[tasks."editors:vscode"]
description = "Package the VS Code extension as editors/vscode-semanticshape/semanticshape-<version>.vsix"
dir = "editors/vscode-semanticshape"
run = """
npm install --no-audit --no-fund
npx --yes @vscode/vsce package --skip-license
"""

[tasks."editors:vscode:install"]
description = "Package the VS Code extension and install it into VS Code"
depends = ["editors:vscode"]
dir = "editors/vscode-semanticshape"
run = 'code --install-extension "semanticshape-$(node -p "require(\"./package.json\").version").vsix"'

[tasks.editors]
description = "Install the language server and build both editor extensions"
depends = ["lsp", "editors:zed", "editors:vscode"]
